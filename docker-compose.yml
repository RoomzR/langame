services:
  postgres:
    image: postgres:16-alpine
    container_name: arenaos-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: arenaos
      POSTGRES_PASSWORD: arenaos
      POSTGRES_DB: arenaos
    ports:
      - "5434:5432"
    volumes:
      - arenaos_pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U arenaos"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: arenaos-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: arenaos-api
    restart: unless-stopped
    profiles: ["full"]
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql://arenaos:arenaos@postgres:5432/arenaos
      REDIS_URL: redis://redis:6379
    ports:
      - "3000:3000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  nginx:
    image: nginx:1.27-alpine
    container_name: arenaos-nginx
    restart: unless-stopped
    profiles: ["full"]
    ports:
      - "8080:80"
    volumes:
      - ./infra/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - api

volumes:
  arenaos_pg:
